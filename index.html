    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "FinanCarePersonal",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "url": "https://personal.financare.rilindkycyku.dev/",
        "inLanguage": "sq",
        "description": "Ndjekës i financave personale që i ruan të dhënat vetëm në shfletuesin tuaj — të ardhura, shpenzime, buxhete, këste dhe qëllime kursimi.",

        "author": { "@type": "Person", "name": "Rilind Kyçyku", "url": "https://rilindkycyku.dev" }
      }
    </script>
  </head>
  <body>
    <script>
      // Applied before React mounts so there's no flash of the wrong theme on load.
      (function () {
        try {
          if (localStorage.getItem("financarepersonal-theme") === "light") {
            document.body.classList.add("light-mode");
          }
        } catch (e) {
          /* localStorage unavailable — default dark theme stands */
        }
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
